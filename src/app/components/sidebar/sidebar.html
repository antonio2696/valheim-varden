<aside
    class="relative flex w-full shrink-0 flex-col border-b border-[#30362f] bg-[#101310] px-4 py-4 md:fixed md:inset-y-0 md:left-0 md:z-40 md:w-64 md:border-b-0 md:border-r md:px-5 md:py-6"
>
    <a
        routerLink="/home"
        class="flex w-fit items-center gap-3 rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d6ab62]"
        aria-label="Varden — Minhas listas"
    >
        <span
            class="flex size-11 shrink-0 items-center justify-center rounded-sm border border-[#8d6d36] text-[#d6ab62]"
        >
            <svg [vardenIcon]="brandIcon" [size]="22" aria-hidden="true"></svg>
        </span>
        <span class="flex flex-col">
            <span class="font-cinzel text-[14px] font-semibold leading-tight text-[#eee8db]"
                >Varden</span
            >
            <span class="mt-1 text-[11px] uppercase tracking-wide text-[#d6ab62]"
                >Códice do construtor</span
            >
        </span>
    </a>

    <nav aria-label="Navegação das listas" class="mt-5 md:mt-7">
        <h2
            class="mb-3 font-cinzel text-[14px] font-semibold uppercase tracking-wide text-[#d6ab62]"
        >
            Minhas listas
        </h2>
        <ul
            class="flex gap-2 overflow-x-auto pb-1 md:flex-col md:gap-1 md:overflow-visible md:pb-0"
        >
            @for (item of items(); track item.id) {
            <li class="shrink-0 md:shrink">
                <a
                    [routerLink]="['/view-list', item.id]"
                    [title]="item.label"
                    routerLinkActive="!text-[#d6ab62] font-cinzel"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="group flex w-full min-w-0 items-center gap-2 rounded-sm px-2 py-2 text-[14px] text-[#969b90] transition-colors hover:bg-[#1c211d] hover:text-[#eee8db] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#d6ab62]"
                >
                    <span
                        aria-hidden="true"
                        class="text-[#657060] transition-colors group-hover:text-[#d6ab62]"
                        >◆</span
                    >
                    <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <div class="mt-5 hidden rounded border border-[#30362f] p-4 md:mt-auto md:block">
        <svg [vardenIcon]="tipIcon" [size]="18" class="text-[#d6ab62]" aria-hidden="true"></svg>
        <p class="mt-3 text-[14px] leading-5 text-[#a9ada3]">
            Planeje em terra firme. Construa além do horizonte.
        </p>
        <p class="mt-3 text-[14px] uppercase tracking-wide text-[#858b80]">De Viking para Viking</p>
    </div>
</aside>
